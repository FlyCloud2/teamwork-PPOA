# 超参与实验矩阵，按「记录」而非「配置」的角色存在。
# src/ppo_args.py 统一默认值；scripts/run.py 把每个值显式传上命令行，
# 并把解析后的值写进 runs/<id>/config.json。本文件
# 存在的意义，是让读者（或报告的方法一节）不用读 argparse 就能在一屏内
# 看清整体设计。两者若有一天冲突，以 config.json 为准。
#
# 数值出处：PPO 论文 arXiv:1707.06347v2 Table 3（「MuJoCo 任务的超参数」），
# 另有标注者除外。与论文的偏差清单在 docs/deviations.md。

paper_table_3:            # Table 3 中共享超参那一列
  learning_rate: 3.0e-4
  adam_eps: 1.0e-5
  hidden_sizes: [64, 64]
  activation: tanh
  orthogonal_init: true   # 策略/价值输出层权重的初始化 gain 为 0.01/1.0；策略初始 logstd=0。
  timesteps_per_actor: 2048   # 论文里的 T
  minibatch_size: 64          # 论文里的 M；CleanRL 暴露的是 num_minibatches = T*N/M = 32
  update_epochs: 10           # 论文里的 K
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2              # 式(7) 里的 epsilon
  entropy_coef: 0.0
  value_coef: 0.5
  max_grad_norm: 0.5          # 全局梯度范数裁剪
  advantage_normalization: per_minibatch
  value_loss_clipping: true   # 论文不裁剪价值损失，CleanRL 裁（属偏差）

# 实验矩阵。刻意缩小尺度：每个变体 3 环境 x 3 种子 = 9 次，
# 而不是论文的 7 环境 x 3 种子 x 11 组配置。
matrix:
  envs: [HalfCheetah-v4, Hopper-v4, Walker2d-v4]   # 论文 7 个里的 3 个
  seeds: [0, 1, 2]                                  # 评分要求的最低值就是 3
  total_timesteps: 1000000                          # 每个环境，与论文一致
  smoke_timesteps: 20000                            # 只用于 W1 验证管线，永不进入报告

# W4 的 C2 矩阵：只动一个因子（同一 batch 重复几个 epoch）。
# 两端由同一台机器、同一依赖、同一预算产生，所以 K 是唯一的候选解释；
# 论文从未消融 K，这也是 W5 单因子扩展的起点。
c2_matrix:
  factor: update_epochs
  arms: [1, 10]
  variant: clip0.2              # 论文默认的裁剪目标，只换 K
  envs: [HalfCheetah-v4, Hopper-v4, Walker2d-v4]
  seeds: [0, 1, 2]
  total_timesteps: 1000000
  label_pattern: "k{epochs}"    # run_id: ..._<env>_seed<s>_clip0.2_k1_full
  jobs: 9                       # 本机 20 逻辑核，每个进程 1 个 OMP 线程
  threads: 1

# 论文 Table 1 的原始数字（7 任务、归一化分数）单独放在一个机器可读文件里，
# 由 scripts/make_table.py 读取；任何脚本都不内嵌这些数字。
paper_reference: configs/paper_table1.json

# 代理目标变体。用字符串（而不是布尔）保存，这样 W3 增加
# 自适应 eps / 非对称裁剪时不用改 schema。
variants:
  clip0.2:      {desc: "paper default, epsilon = 0.2", flags: ["--clip-coef", "0.2"]}
  noclip:       {desc: "epsilon -> 1e9: the clipped surrogate degenerates to vanilla PG",
                 flags: ["--clip-coef", "1000000000.0"]}
  kl-early-stop: {desc: "legacy clipped PPO with KL early stopping; NOT adaptive KL penalty",
                 flags: ["--clip-coef", "0.2", "--target-kl", "0.01"]}
  adaptiveKL: {desc: "paper Algorithm 2 literally: adaptive beta, no upper bound",
               flags: ["--surrogate", "kl-penalty", "--kl-coef", "1.0",
                       "--kl-target", "0.01", "--kl-coef-max", "1e300"]}
  adaptiveKL-capped: {desc: "controlled run 1: beta capped at 1 / d_targ = 100",
                      flags: ["--surrogate", "kl-penalty", "--kl-coef", "1.0",
                              "--kl-target", "0.01", "--kl-coef-max", "100"]}
  adaptiveKL-tight: {desc: "controlled run 2: beta never exceeds its initial value of 1",
                     flags: ["--surrogate", "kl-penalty", "--kl-coef", "1.0",
                             "--kl-target", "0.01", "--kl-coef-max", "1"]}

# 在 env.txt 那台机器上实测的执行参数（不来自论文）。
execution:
  device: cpu             # W2 明确指定 CPU；没有测过 GPU 对照。
  threads: 1              # W2 matrix 默认；单次 run.py 仍默认 4，需显式 --threads 1。
  jobs: 3                 # 本机同时运行三个独立环境进程。
  budget_policy: exact    # 488 个完整 batch + 末批 576 步，共 489 次更新。
  final_minibatch_size: 18 # 576 / 32；末批仍做 10 个 epoch。
  actual_wall_time: logs/w2_summary.json # 从完成的 run 自动生成，不填写估计结果。

# 报告的 Results 一节必须能追溯到的观测指标。
logging:
  csv: progress.csv       # 每次更新一行，由 src/ppo_continuous_action.py 写出
  columns: [global_step, episode_return, episode_length, policy_loss, value_loss,
            entropy, approx_kl, clipfrac, explained_variance, learning_rate, wall_time_s]
  tensorboard: true       # 只落 events/；二进制，已 gitignore
